plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
    id 'io.gitlab.arturbosch.detekt'
}

android {
    namespace 'org.indra.android.core'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Release provisioning without editing source: pass -Pindra.otaSigningKey=<base64 SPKI>
        // (or export INDRA_OTA_SIGNING_KEY) at build time. The placeholder default keeps the
        // fail-closed "unverified signature refused" path in OtaUpdateManager.
        buildConfigField 'String', 'OTA_SIGNING_KEY_SPKI',
                '"' + (findProperty('indra.otaSigningKey')
                        ?: System.getenv('INDRA_OTA_SIGNING_KEY')
                        ?: 'REPLACE_ME_WITH_BASE64_X509_PUBLIC_KEY') + '"'
        // Optional TLS pin (<sha256>/<base64>); empty disables pinning (signature still checked).
        buildConfigField 'String', 'OTA_TLS_PIN',
                '"' + (findProperty('indra.otaTlsPin')
                        ?: System.getenv('INDRA_OTA_TLS_PIN')
                        ?: '') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'com.google.dagger:hilt-android:2.57.2'
    kapt 'com.google.dagger:hilt-android-compiler:2.57.2'
    implementation 'javax.inject:javax.inject:1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.apache.commons:commons-compress:1.26.0'
    implementation 'org.tukaani:xz:1.9'

    testImplementation 'junit:junit:4.13.2'
    // commons-compress's TarArchiveOutputStream reaches for org.apache.commons.codec.Charsets
    // at runtime (the TarExtract tests build archives), and it is not a transitive dependency.
    testImplementation 'commons-codec:commons-codec:1.16.1'
    // A real org.json for unit tests: the mockable android.jar stub returns defaults.
    testImplementation 'org.json:json:20240303'
}

detekt {
    config.setFrom(files("$rootDir/detekt.yml"))
    buildUponDefaultConfig = true
    allRules = false
    baseline = file("$projectDir/detekt-baseline.xml")
}
