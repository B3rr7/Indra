plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
}

android {
    namespace 'org.indra.android'
    compileSdk 34

    defaultConfig {
        applicationId "org.indra.android"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            jniDebuggable true
            buildConfigField "long", "BUILD_TIME", System.currentTimeMillis() + "L"
            buildConfigField "String", "BUILD_NAME", "\"${System.getenv("USER") ?: "unknown"}\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "long", "BUILD_TIME", System.currentTimeMillis() + "L"
            buildConfigField "String", "BUILD_NAME", "\"${System.getenv("USER") ?: "unknown"}\""
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.create("release") {
                    storeFile = file(System.getenv("KEYSTORE_FILE"))
                    storePassword = System.getenv("KEYSTORE_PWD")
                    keyAlias = System.getenv("KEYSTORE_ALIAS")
                    keyPassword = System.getenv("KEYSTORE_ALIAS_PWD")
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    ndkVersion = "25.2.9519653"
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2024.02.02')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // ViewModel + LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Hilt DI
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-android-compiler:2.51.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Compression
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'org.tukaani:xz:1.9'

    // Semver
    implementation 'com.github.zafarkhaja:java-semver:0.9.0'

    // MsgPack
    implementation 'org.msgpack:msgpack-core:0.9.3'

    // Charset detection
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'

    // HTML unescape
    implementation 'org.unbescape:unbescape:1.1.6.RELEASE'

    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Splash screen
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// Bundle the native core produced by `indra/jni/build.sh cores` into assets so
// CoreManager can install it without a network download.
def coreDistDir = file("$projectDir/dist")
tasks.register("bundleCore", Copy) {
    onlyIf { coreDistDir.exists() }
    from(coreDistDir) {
        include "core-v*+android16.armeabi-v7a.tar.xz"
        include "core-v*+android16.arm64-v8a.tar.xz"
        rename { name ->
            // core-vX.Y.Z+androidN.<abi>.tar.xz  ->  core-<abi>.tar.xz
            def m = (name =~ /core-v[^+]+\+android\d+\.([^.]+)\.tar\.xz/)
            if (m.matches()) {
                "core-${m.group(1)}.tar.xz"
            } else {
                name
            }
        }
    }
    into file("$projectDir/src/main/assets")
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn tasks.named('bundleCore')
}
