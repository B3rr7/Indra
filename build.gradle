plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
    // Since Kotlin 2.0 the Compose compiler ships with Kotlin itself; the version must match
    // the Kotlin plugin exactly (it is the same artifact release train).
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21' apply false
    // Navigation 3 routes are @Serializable data objects implementing NavKey.
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.21' apply false
    id 'com.google.dagger.hilt.android' version '2.57.2' apply false
    id 'io.gitlab.arturbosch.detekt' version '1.23.8' apply false
}
