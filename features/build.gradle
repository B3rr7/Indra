plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.hilt)
    id 'kotlin-kapt'
    alias(libs.plugins.detekt)
}

android {
    namespace 'org.indra.android.features'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    testOptions {
        // ViewModels touch android.util.Log through core helpers; unit tests only need the
        // stubs to return defaults instead of throwing "not mocked".
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(':core')
    implementation project(':data')
    implementation project(':ui')
    implementation libs.androidx.lifecycle.runtime.compose
    implementation platform(libs.compose.bom)
    implementation libs.androidx.core.ktx
    implementation libs.compose.ui
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.androidx.hilt.lifecycle.viewmodel.compose
    implementation libs.hilt.android
    implementation libs.osmdroid.android
    implementation libs.gson
    kapt libs.hilt.android.compiler

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    // The fake builds the real `ToolHandle.Ready` payload, whose type takes a Gson instance;
    // `:core` declares gson as `implementation`, so it is not on this module's test classpath.
    testImplementation libs.gson
}

detekt {
    config.setFrom(files("$rootDir/detekt.yml"))
    buildUponDefaultConfig = true
    allRules = false
    baseline = file("$projectDir/detekt-baseline.xml")
}
