name: Build bundle

# Builds, signs and publishes a runtime bundle that the app consumes at
# Settings → Bundle Updates.
#
# Deliverable (one GitHub Release per channel tag):
#   tools-bundle.tar.gz.bin   the archive
#   tools-bundle.json         its signed manifest
#   tools-bundle.json.sig     DER ECDSA P-256 signature over the manifest bytes
#
# The app pins the matching public key in `SignatureVerifier.PINNED_PUBLIC_KEY_PEM`.
# Generate the CI keypair once (keep the private half in the BUNDLE_SIGNING_KEY
# repository secret, never in the repo):
#   openssl ecparam -name prime256v1 -genkey -noout -out bundle-key.pem
#   openssl ec -in bundle-key.pem -pubout -out bundle-key.pub
# Then paste bundle-key.pub into PINNED_PUBLIC_KEY_PEM.
#
# Signing is over the exact manifest bytes: `openssl dgst -sha256 -sign` emits
# the DER signature the app's SignatureVerifier.verify(data, signature) expects.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version (default: <core-version>+<run number>)'
        required: false
        type: string
      min_app:
        description: 'Minimum app versionCode for this bundle'
        required: false
        default: '1'
        type: string
      msf:
        description: 'Also build the Metasploit rootfs bundle (~400 MB, 30-60 min)'
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly, Mondays 03:00 UTC.
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # The EOL tool tree in `indra/jni` needs `ndk-build`/`ndk-which`, which NDK 27 removed.
      # The runner images only ship 27.3/29.0/30.0, so 25.2 has to be installed explicitly.
      - name: Install NDK 25.2
        run: |
          set -euo pipefail
          sdkmanager=$(command -v sdkmanager || true)
          if [ -z "$sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf "$ANDROID_HOME/cmdline-tools-tmp"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools-tmp"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools-tmp/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;25.2.9519653"
          test -x "$ANDROID_HOME/ndk/25.2.9519653/ndk-build"

      # Build the Rust daemon FIRST: `build.sh cores` → `pack_core` embeds it as the core's
      # `indrad` when it is present (Phase 7 switched the default daemon to Rust).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Build Rust daemon
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          # The committed .cargo/config.toml resolves the linkers by name, so the NDK's
          # bin dir must be on PATH.
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd rust/indrad
          cargo test                                                   # nmap parser unit tests (host)
          cargo build --target aarch64-linux-android   --release       # arm64-v8a
          cargo build --target armv7-linux-androideabi --release       # armeabi-v7a
          # core packaging copies these straight in (see indra/jni/build.sh pack_core)
          mkdir -p ../../indra/dist/indrad
          cp target/aarch64-linux-android/release/indrad   ../../indra/dist/indrad/arm64-v8a
          cp target/armv7-linux-androideabi/release/indrad ../../indra/dist/indrad/armeabi-v7a
          # bundle payload (single-abi convenience copy kept for backward compatibility)
          mkdir -p ../../indra/dist
          cp target/aarch64-linux-android/release/indrad ../../indra/dist/indrad-rust

      - name: Build native core
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          # `build.sh` calls a bare `ndk-build` (it has always relied on the NDK being on
          # PATH), and the setup actions only put platform-tools/cmdline-tools there.
          export PATH="$ANDROID_NDK_HOME:$PATH"
          command -v ndk-build
          cd indra/jni
          ./build.sh cores

      - name: Package tools bundle
        run: |
          set -euo pipefail
          asset=$(ls indra/dist/core-*.tar.xz | sort | tail -n1)
          echo "Packaging from $asset"
          mkdir -p build/core build/out
          tar -xJf "$asset" -C build/core
          # The bundle carries the tools/ payload only. `indrad` (now the Rust daemon),
          # handlers/ and lib/ travel inside the APK core asset that CoreManager installs —
          # `pack_core` embedded the Rust binary there in the step above.
          tar -czf build/out/tools-bundle.tar.gz -C build/core tools
          mv build/out/tools-bundle.tar.gz build/out/tools-bundle.tar.gz.bin

      - name: Generate signed manifest
        env:
          BUNDLE_SIGNING_KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
          MIN_APP: ${{ github.event.inputs.min_app || '1' }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE_SIGNING_KEY:-}" ]; then
            echo "::error::BUNDLE_SIGNING_KEY secret is not set; cannot sign the manifest."
            exit 1
          fi
          cd build/out
          file=tools-bundle.tar.gz.bin
          size=$(stat -c%s "$file")
          unpacked=$(gunzip -c "$file" | wc -c)
          sha=$(sha256sum "$file" | awk '{print $1}')
          built=$(date +%s)
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            core=$(basename "$(ls "$GITHUB_WORKSPACE"/indra/dist/core-*.tar.xz | sort | tail -n1)" .tar.xz)
            version="${core}+${GITHUB_RUN_NUMBER}"
          fi
          printf '{"format":1,"id":"tools","version":"%s","file":"%s","sha256":"%s","size":%s,"unpacked":%s,"minApp":%s,"built":%s}' \
            "$version" "$file" "$sha" "$size" "$unpacked" "$MIN_APP" "$built" > tools-bundle.json
          printf '%s' "$BUNDLE_SIGNING_KEY" > ../signing-key.pem
          openssl dgst -sha256 -sign ../signing-key.pem -out tools-bundle.json.sig tools-bundle.json
          rm -f ../signing-key.pem
          echo "Signed tools bundle ${version} (${size} bytes)"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('build/out/tools-bundle.json'))['version'])")
          tag="bundles-tools-${version}"
          gh release create "$tag" \
            build/out/tools-bundle.tar.gz.bin \
            build/out/tools-bundle.json \
            build/out/tools-bundle.json.sig \
            --title "Tools bundle ${version}" \
            --notes "Signed tools bundle built from ${GITHUB_SHA}."

  # ---------------------------------------------------------------------------
  # Metasploit: one self-contained aarch64 Alpine/musl rootfs (Ruby + the
  # framework + its vendored gems). Download-only, so the APK is unchanged.
  #
  # Built on a native arm64 runner: the payload *is* aarch64, so there is no
  # emulation, no proot and — crucially — no NDK. Metasploit's C-extension gems
  # can only be built for bionic with the NDK, and the device has no compiler,
  # which is why this ships as a chroot instead.
  # ---------------------------------------------------------------------------
  msf:
    if: github.event_name == 'workflow_dispatch' && inputs.msf
    runs-on: ubuntu-24.04-arm
    container: alpine:3.20
    steps:
      - name: Install prerequisites
        run: apk add --no-cache bash curl tar openssl coreutils git

      - uses: actions/checkout@v4

      - name: Build Metasploit rootfs
        run: |
          set -euo pipefail
          scripts/build-msf-bundle.sh --out build/out --work build/msf-rootfs

      - name: Sign manifest
        env:
          BUNDLE_SIGNING_KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE_SIGNING_KEY:-}" ]; then
            echo "::error::BUNDLE_SIGNING_KEY secret is not set; cannot sign the manifest."
            exit 1
          fi
          printf '%s' "$BUNDLE_SIGNING_KEY" > build/signing-key.pem
          openssl dgst -sha256 -sign build/signing-key.pem \
            -out build/out/msf-bundle.json.sig build/out/msf-bundle.json
          rm -f build/signing-key.pem

      - uses: actions/upload-artifact@v4
        with:
          name: msf-bundle
          path: |
            build/out/msf-bundle.tar.gz
            build/out/msf-bundle.json
            build/out/msf-bundle.json.sig

  publish-msf:
    needs: msf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msf-bundle
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('out/msf-bundle.json'))['version'])")
          tag="bundles-msf-${version}"
          assets="out/msf-bundle.tar.gz out/msf-bundle.json out/msf-bundle.json.sig"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" $assets --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" $assets --repo "$GITHUB_REPOSITORY" \
              --title "Metasploit bundle ${version}" \
              --notes "Signed Metasploit rootfs built from ${GITHUB_SHA}."
          fi
