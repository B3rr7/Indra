name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # The core archive embeds the Rust daemon (`indra/jni/build.sh pack_core` refuses to
      # fall back to the deleted C daemon), so the cross-compiled binaries come first.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Build Rust daemon
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd rust/indrad
          cargo test
          cargo build --target aarch64-linux-android --release
          cargo build --target armv7-linux-androideabi --release

      - name: Core archive
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          cd indra/jni && ./build.sh cores

      - name: Tests + detekt
        run: ./gradlew test detekt

      - name: Assemble debug
        run: ./gradlew :indra:assembleDebug

      - name: Verify native artifacts
        run: ./gradlew :indra:checkApkArtifactsDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: indra-debug
          path: indra/build/outputs/apk/debug/*.apk
