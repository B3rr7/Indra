name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: JNI libs
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          cd indra/jni && ./build.sh jni

      - name: Core archive
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          cd indra/jni && ./build.sh cores

      - name: Tests + detekt
        run: ./gradlew test detekt

      - name: Assemble debug
        run: ./gradlew :indra:assembleDebug

      - name: Verify native artifacts
        run: ./gradlew :indra:checkApkArtifactsDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: indra-debug
          path: indra/build/outputs/apk/debug/*.apk
