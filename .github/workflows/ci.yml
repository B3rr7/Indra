name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # The EOL tool tree in `indra/jni` needs `ndk-build`/`ndk-which`, which NDK 27 removed.
      # The runner images only ship 27.3/29.0/30.0, so 25.2 has to be installed explicitly —
      # otherwise `build.sh cores` dies with "ndk-build not found" (or, worse, silently links
      # against the wrong sysroot).
      - name: Install NDK 25.2
        run: |
          set -euo pipefail
          sdkmanager=$(command -v sdkmanager || true)
          if [ -z "$sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf "$ANDROID_HOME/cmdline-tools-tmp"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools-tmp"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools-tmp/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;25.2.9519653"
          test -x "$ANDROID_HOME/ndk/25.2.9519653/ndk-build"

      # The core archive embeds the Rust daemon (`indra/jni/build.sh pack_core` refuses to
      # fall back to the deleted C daemon), so the cross-compiled binaries come first.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Build Rust daemon
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd rust/indrad
          cargo test
          cargo build --target aarch64-linux-android --release
          cargo build --target armv7-linux-androideabi --release

      - name: Core archive
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          # `build.sh` calls a bare `ndk-build` (it has always relied on the NDK being on
          # PATH), and the setup actions only put platform-tools/cmdline-tools there.
          export PATH="$ANDROID_NDK_HOME:$PATH"
          command -v ndk-build
          cd indra/jni && ./build.sh cores
          ls -l ../../indra/dist/core-*.tar.xz

      - name: Tests + detekt
        run: ./gradlew test detekt

      - name: Assemble debug
        run: ./gradlew :indra:assembleDebug

      - name: Verify native artifacts
        run: ./gradlew :indra:checkApkArtifactsDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: indra-debug
          path: indra/build/outputs/apk/debug/*.apk
