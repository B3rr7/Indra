# Single source of truth for every plugin, library and version in the build.
#
# Rules this file keeps:
# - One version per coordinate. `commons-compress` was 1.26.0 in :core and 1.26.1 in :indra before
#   the catalog; it is unified on 1.26.1 (a patch release) so the two modules cannot disagree again.
# - Compose is BOM-managed: the compose-* aliases below carry no version, exactly as before.
# - Pins that carry a reason keep that reason next to the version, not only in AGENTS.md.

[versions]
agp = "8.13.2"
kotlin = "2.2.21"
hilt = "2.57.2"
detekt = "1.23.8"

# Compose BOM 2025.10.01 = Compose 1.9.4 / Material3 1.4.0.
composeBom = "2025.10.01"

coreKtx = "1.17.0"
lifecycle = "2.10.0"
activityCompose = "1.12.4"
# Nav3 1.2.0 and lifecycle-viewmodel-navigation3 2.11.0 declare minCompileSdk=37 / AGP 9.1, so both
# are pinned one minor behind this toolchain (AGP 8.13.2, compileSdk 36).
navigation3 = "1.1.7"
hiltLifecycleViewmodelCompose = "1.3.0"
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "4.12.0"
gson = "2.10.1"
commonsCompress = "1.26.1"
xz = "1.9"
osmdroid = "6.1.18"
splashscreen = "1.0.1"
javaxInject = "1"

junit = "4.13.2"
# commons-compress's TarArchiveOutputStream reaches for org.apache.commons.codec.Charsets at
# runtime (the TarExtract tests build archives) and does not pull it in transitively.
commonsCodec = "1.16.1"
# A real org.json for unit tests: the mockable android.jar stub returns defaults.
json = "20240303"
androidxTestJunit = "1.1.5"
espresso = "3.5.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

# Compose: versions come from the BOM, so these aliases carry none.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# `hilt-lifecycle-viewmodel-compose` is the Nav2-free home of hiltViewModel();
# `hilt-navigation-compose` would drag androidx.navigation (Navigation 2) back in.
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleViewmodelCompose" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }

navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commonsCodec" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
osmdroid-android = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }

junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Since Kotlin 2.0 the Compose compiler ships with Kotlin itself: this plugin's version is the
# Kotlin version, and the two must always move together.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Navigation 3 routes are @Serializable data objects implementing NavKey.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
