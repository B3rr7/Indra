[package]
name = "indrad"
version = "1.0.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Unix system calls
nix = { version = "0.29", features = ["process", "signal", "fs", "socket"] }
# Logging
log = "0.4"
env_logger = "0.11"
# Error handling
anyhow = "1"
libc = "0.2"

[profile.release]
opt-level = "z"     # optimize for size
lto = true
strip = true
panic = "abort"
